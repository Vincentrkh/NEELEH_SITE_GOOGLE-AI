<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">

<defs>
  <!-- Reference architectural palette -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#F2F0EB"/>
    <stop offset="1" stop-color="#EDEAE4"/>
  </linearGradient>

  <linearGradient id="waterGrad" x2="0" y2="1">
    <stop stop-color="#DCE4E4" stop-opacity=".6"/>
    <stop offset="1" stop-color="#C9D6D6" stop-opacity=".4"/>
  </linearGradient>

  <clipPath id="pond">
    <ellipse cx="140" cy="150" rx="55" ry="18"/>
  </clipPath>

  <filter id="fade">
    <feGaussianBlur stdDeviation="1.5"/>
  </filter>

  <filter id="softBlur">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>

<!-- Background -->
<rect width="480" height="200" fill="url(#bg)"/>

<!-- Distant city fabric — hairline, fading at edges -->
<g stroke="#B8B5AE" stroke-width="0.4" fill="none" opacity="0.2">
  <line x1="0" y1="45" x2="100" y2="45"/>
  <line x1="0" y1="55" x2="80" y2="55"/>
  <line x1="380" y1="40" x2="480" y2="40"/>
  <line x1="400" y1="52" x2="480" y2="52"/>
  <rect x="15" y="30" width="18" height="15"/>
  <rect x="40" y="35" width="14" height="10"/>
  <rect x="410" y="25" width="16" height="17"/>
  <rect x="435" y="32" width="12" height="10"/>
  <rect x="455" y="38" width="14" height="8"/>
</g>

<!-- Buildings — thick outline, architectural volumes -->
<g stroke="#B8B5AE" stroke-width="1.5" fill="none">
  <rect x="55" y="60" width="70" height="90"/>
  <rect x="55" y="60" width="70" height="25"/>
  <line x1="55" y1="85" x2="125" y2="85"/>
  <line x1="55" y1="110" x2="125" y2="110"/>
  <line x1="90" y1="60" x2="90" y2="150"/>

  <!-- Pavilion extension -->
  <rect x="125" y="70" width="40" height="35"/>
  <line x1="125" y1="70" x2="165" y2="70"/>

  <!-- Right building -->
  <rect x="300" y="55" width="60" height="95"/>
  <line x1="300" y1="80" x2="360" y2="80"/>
  <line x1="300" y1="105" x2="360" y2="105"/>
  <line x1="300" y1="130" x2="360" y2="130"/>
  <line x1="330" y1="55" x2="330" y2="150"/>
</g>

<!-- Poché — section cut fill in maroon -->
<g fill="#8E3B3B" opacity="0.15">
  <rect x="55" y="60" width="5" height="90"/>
  <rect x="120" y="60" width="5" height="90"/>
  <rect x="55" y="145" width="70" height="5"/>
  <rect x="300" y="55" width="5" height="95"/>
  <rect x="355" y="55" width="5" height="95"/>
</g>

<!-- Water pond -->
<g>
  <ellipse cx="140" cy="150" rx="55" ry="18" fill="url(#waterGrad)"/>
  <g clip-path="url(#pond)">
    <!-- Water ripple lines — animated -->
    <path d="M100 148 Q120 145 140 148 Q160 151 180 148" fill="none" stroke="#B8B5AE" stroke-width="0.4" opacity="0.5">
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
        values="M100 148 Q120 145 140 148 Q160 151 180 148;
                M100 148 Q120 151 140 145 Q160 148 180 148;
                M100 148 Q120 145 140 148 Q160 151 180 148"/>
    </path>
    <path d="M110 154 Q130 151 150 154" fill="none" stroke="#B8B5AE" stroke-width="0.3" opacity="0.35">
      <animate attributeName="d" dur="3s" repeatCount="indefinite"
        values="M110 154 Q130 151 150 154;
                M110 154 Q130 157 150 151;
                M110 154 Q130 151 150 154"/>
    </path>
  </g>
  <!-- Pond edge — outline -->
  <ellipse cx="140" cy="150" rx="55" ry="18" fill="none" stroke="#B8B5AE" stroke-width="0.8" opacity="0.5"/>
</g>

<!-- Vegetation — pale sage circles, animated sway -->
<g fill="#E4E6E0" stroke="#B8B5AE" stroke-width="0.4" opacity="0.8">
  <g>
    <circle cx="200" cy="80" r="8">
      <animateTransform attributeName="transform" type="rotate" values="0 200 95; 3 200 95; 0 200 95; -3 200 95; 0 200 95" dur="6s" repeatCount="indefinite"/>
    </circle>
    <line x1="200" y1="88" x2="200" y2="105" stroke="#B8B5AE" stroke-width="0.4"/>
  </g>
  <g>
    <circle cx="220" cy="75" r="6">
      <animateTransform attributeName="transform" type="rotate" values="0 220 95; -3 220 95; 0 220 95; 3 220 95; 0 220 95" dur="7s" repeatCount="indefinite"/>
    </circle>
    <line x1="220" y1="81" x2="220" y2="105" stroke="#B8B5AE" stroke-width="0.4"/>
  </g>
  <g>
    <circle cx="285" cy="70" r="7">
      <animateTransform attributeName="transform" type="rotate" values="0 285 95; 2 285 95; 0 285 95; -2 285 95; 0 285 95" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="285" y1="77" x2="285" y2="105" stroke="#B8B5AE" stroke-width="0.4"/>
  </g>
</g>

<!-- People — maroon accent figures, animated walk -->
<g fill="#8E3B3B">
  <!-- Person 1 — walking along path -->
  <circle cx="180" cy="110" r="1.5">
    <animate attributeName="cx" values="180;200;180" dur="8s" repeatCount="indefinite"/>
  </circle>
  <rect x="178.5" y="111" width="3" height="5" rx="1">
    <animate attributeName="x" values="178.5;198.5;178.5" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Person 2 — static, near building -->
  <circle cx="110" cy="120" r="1.5"/>
  <rect x="108.5" y="121" width="3" height="5" rx="1"/>

  <!-- Person 3 — walking opposite direction -->
  <circle cx="250" cy="125" r="1.5">
    <animate attributeName="cx" values="250;230;250" dur="10s" repeatCount="indefinite"/>
  </circle>
  <rect x="248.5" y="126" width="3" height="5" rx="1">
    <animate attributeName="x" values="248.5;228.5;248.5" dur="10s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Birds — animated maroon flight -->
<g fill="#8E3B3B" opacity="0.7">
  <path d="M 70 35 Q 73 32 76 35 Q 73 34 70 35 Z">
    <animate attributeName="d" dur="12s" repeatCount="indefinite"
      values="M 70 35 Q 73 32 76 35 Q 73 34 70 35 Z;
              M 150 30 Q 153 27 156 30 Q 153 29 150 30 Z;
              M 230 35 Q 233 32 236 35 Q 233 34 230 35 Z;
              M 310 28 Q 313 25 316 28 Q 313 27 310 28 Z;
              M 390 32 Q 393 29 396 32 Q 393 31 390 32 Z;
              M 310 28 Q 313 25 316 28 Q 313 27 310 28 Z;
              M 230 35 Q 233 32 236 35 Q 233 34 230 35 Z;
              M 150 30 Q 153 27 156 30 Q 153 29 150 30 Z;
              M 70 35 Q 73 32 76 35 Q 73 34 70 35 Z"/>
  </path>
  <path d="M 85 42 Q 88 39 91 42 Q 88 41 85 42 Z" opacity="0.5">
    <animate attributeName="d" dur="14s" repeatCount="indefinite"
      values="M 85 42 Q 88 39 91 42 Q 88 41 85 42 Z;
              M 165 37 Q 168 34 171 37 Q 168 36 165 37 Z;
              M 245 42 Q 248 39 251 42 Q 248 41 245 42 Z;
              M 325 35 Q 328 32 331 35 Q 328 34 325 35 Z;
              M 405 38 Q 408 35 411 38 Q 408 37 405 38 Z;
              M 325 35 Q 328 32 331 35 Q 328 34 325 35 Z;
              M 245 42 Q 248 39 251 42 Q 248 41 245 42 Z;
              M 165 37 Q 168 34 171 37 Q 168 36 165 37 Z;
              M 85 42 Q 88 39 91 42 Q 88 41 85 42 Z"/>
  </path>
</g>

<!-- Pathways — dashed draw-on lines -->
<g stroke="#B8B5AE" stroke-width="0.5" fill="none" opacity="0.4" stroke-dasharray="3,3">
  <path d="M125 105 Q 170 105 200 105 Q 230 105 250 125 Q 270 140 300 140">
    <animate attributeName="stroke-dashoffset" values="0;20" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M125 130 Q 160 130 180 140 Q 200 148 220 150">
    <animate attributeName="stroke-dashoffset" values="0;16" dur="2.5s" repeatCount="indefinite"/>
  </path>
</g>

<!-- Level datum lines — very faint -->
<g stroke="#B8B5AE" stroke-width="0.2" opacity="0.15">
  <line x1="55" y1="150" x2="360" y2="150"/>
  <text x="365" y="153" font-size="4" fill="#B8B5AE" opacity="0.3" font-family="monospace">+0.00</text>
  <line x1="55" y1="60" x2="360" y2="60"/>
  <text x="365" y="63" font-size="4" fill="#B8B5AE" opacity="0.3" font-family="monospace">+9.00</text>
</g>

<!-- Edge fade overlay -->
<rect width="480" height="200" fill="#F2F0EB" opacity="0.12" style="mix-blend-mode: lighten;">
  <animate attributeName="opacity" values="0.08;0.18;0.08" dur="6s" repeatCount="indefinite"/>
</rect>
<rect width="30" height="200" fill="#F2F0EB" opacity="0.35"/>
<rect x="450" width="30" height="200" fill="#F2F0EB" opacity="0.35"/>

</svg>
