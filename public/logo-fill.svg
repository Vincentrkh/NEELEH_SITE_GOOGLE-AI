<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">

<defs>
  <!-- Water gradient — warm muted palette matching reference style -->
  <linearGradient id="water" x2="0" y2="1">
    <stop stop-color="#DCE4E4" stop-opacity=".85"/>
    <stop offset=".3" stop-color="#B8B5AE" stop-opacity=".75"/>
    <stop offset="1" stop-color="#8E3B3B" stop-opacity=".85"/>
  </linearGradient>

  <!-- Glass body — thin line aesthetic -->
  <linearGradient id="glassBody" x2="1">
    <stop stop-color="#B8B5AE" stop-opacity=".08"/>
    <stop offset=".15" stop-color="#B8B5AE" stop-opacity=".25"/>
    <stop offset=".35" stop-color="#B8B5AE" stop-opacity=".02"/>
    <stop offset=".75" stop-color="#B8B5AE" stop-opacity=".02"/>
    <stop offset=".9" stop-color="#B8B5AE" stop-opacity=".22"/>
    <stop offset="1" stop-color="#B8B5AE" stop-opacity=".08"/>
  </linearGradient>

  <!-- The blob logo as clip-path -->
  <clipPath id="inside">
    <path d="M 22 18 C 12 22, 8 34, 12 46 C 16 58, 28 66, 42 64 C 56 62, 68 52, 68 38 C 68 24, 58 14, 44 14 C 36 14, 28 16, 22 18 Z"/>
  </clipPath>

  <!-- Shadow filter -->
  <filter id="softShadow">
    <feGaussianBlur stdDeviation="2"/>
  </filter>
</defs>

<!-- Shadow -->
<ellipse cx="40" cy="67" rx="24" ry="2" fill="#8E3B3B" opacity=".08" filter="url(#softShadow)"/>

<!-- Water inside blob -->
<g clip-path="url(#inside)">

  <!-- Rising water body -->
  <rect x="0" y="66" width="80" height="80" fill="url(#water)">
    <animate attributeName="y" from="66" to="14" dur="4s" fill="freeze"/>
  </rect>

  <!-- Main wave on surface — thin line aesthetic -->
  <path id="wave" d="M0 14 Q10 11 20 14 Q30 17 40 14 Q50 11 60 14 Q70 17 80 14 L80 80 L0 80 Z" fill="url(#water)" opacity=".8">
    <animate attributeName="d" dur="3s" repeatCount="indefinite" values="
      M0 14 Q10 11 20 14 Q30 17 40 14 Q50 11 60 14 Q70 17 80 14 L80 80 L0 80 Z;
      M0 14 Q10 17 20 12 Q30 8 40 15 Q50 19 60 12 Q70 8 80 14 L80 80 L0 80 Z;
      M0 14 Q10 11 20 14 Q30 17 40 14 Q50 11 60 14 Q70 17 80 14 L80 80 L0 80 Z
    "/>
    <animateTransform attributeName="transform" type="translate" from="0 52" to="0 0" dur="4s" fill="freeze"/>
  </path>

  <!-- Secondary wave — thinner, lighter -->
  <path d="M0 16 Q15 13 30 16 Q45 19 60 16 Q70 13 80 16" fill="none" stroke="#F2F0EB" stroke-width="0.5" opacity=".7">
    <animate attributeName="d" dur="2.5s" repeatCount="indefinite" values="
      M0 16 Q15 13 30 16 Q45 19 60 16 Q70 13 80 16;
      M0 16 Q15 18 30 13 Q45 8 60 17 Q70 20 80 16;
      M0 16 Q15 13 30 16 Q45 19 60 16 Q70 13 80 16
    "/>
    <animateTransform attributeName="transform" type="translate" from="0 50" to="0 0" dur="4s" fill="freeze"/>
  </path>

  <!-- Surface ripples — hairline width -->
  <g fill="none" stroke="#F2F0EB" stroke-width="0.3" opacity=".5">
    <path d="M18 18 Q28 15 38 18">
      <animate attributeName="d" values="
        M18 18 Q28 15 38 18;
        M18 18 Q28 20 38 18;
        M18 18 Q28 15 38 18
      " dur="1.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 48" to="0 0" dur="4s" fill="freeze"/>
    </path>
    <path d="M42 18 Q52 15 62 18">
      <animate attributeName="d" values="
        M42 18 Q52 15 62 18;
        M42 18 Q52 20 62 18;
        M42 18 Q52 15 62 18
      " dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 48" to="0 0" dur="4s" fill="freeze"/>
    </path>
  </g>

  <!-- Underwater light caustics — accent color pulse -->
  <path d="M20 35 Q35 32 45 35 M50 45 Q60 43 65 45" fill="none" stroke="#8E3B3B" stroke-width="0.4" opacity=".15">
    <animate attributeName="opacity" values=".08;.3;.08" dur="3s" repeatCount="indefinite"/>
  </path>

</g>

<!-- Glass body (blob outline) — warm gray thin line -->
<path d="M 22 18 C 12 22, 8 34, 12 46 C 16 58, 28 66, 42 64 C 56 62, 68 52, 68 38 C 68 24, 58 14, 44 14 C 36 14, 28 16, 22 18 Z"
  fill="url(#glassBody)" stroke="#B8B5AE" stroke-width="1.2"/>

<!-- Accent edge highlight — maroon -->
<path d="M 22 18 C 12 22, 8 34, 12 46" fill="none" stroke="#8E3B3B" stroke-width="0.6" opacity=".4"/>

<!-- Eyes -->
<circle cx="30" cy="38" r="4" fill="#F2F0EB"/>
<circle cx="50" cy="38" r="4" fill="#F2F0EB"/>

<!-- Eye connector -->
<rect x="30" y="36.5" width="20" height="1.2" fill="#F2F0EB"/>

</svg>
